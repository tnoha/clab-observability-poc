apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://172.31.100.22:9090
    isDefault: true
    editable: false
  - name: OpenSearch
    uid: opensearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://172.31.100.21:9200
    editable: false
    jsonData:
      database: '[observations-]YYYY.MM.DD'
      interval: Daily
      flavor: opensearch
      version: 2.19.3
      timeField: collected_at
      logMessageField: observation_type
      logLevelField: source.transport
      pplEnabled: true
