[project]
name = "clab-observability-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.18",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scrapli[paramiko]==2025.1.30",
  "pygnmi==0.8.15",
  "prometheus-client==0.22.1",
  "requests==2.32.5",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.10"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
