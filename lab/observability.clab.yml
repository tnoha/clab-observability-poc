    floci:
      kind: linux
      image: floci/floci:2.0.1
      mgmt-ipv4: 172.31.100.20
      ports:
      - 127.0.0.1:4566:4566
      binds:
      - /var/run/docker.sock:/var/run/docker.sock
      env:
        FLOCI_SERVICES_ECS_MOCK: 'false'
        FLOCI_SERVICES_ECS_DOCKER_NETWORK: obs-mgmt
        FLOCI_DOCKER_RESOURCE_NAMESPACE: obs
    opensearch:
      kind: linux
      image: opensearchproject/opensearch:2.19.3
      mgmt-ipv4: 172.31.100.21
      ports:
      - 127.0.0.1:9200:9200
      env:
        discovery.type: single-node
        DISABLE_SECURITY_PLUGIN: 'true'
        DISABLE_INSTALL_DEMO_CONFIG: 'true'
        OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        node.store.allow_mmap: 'false'
      binds:
      - ../runtime/opensearch:/usr/share/opensearch/data
    opensearch-dashboards:
      kind: linux
      image: opensearchproject/opensearch-dashboards:2.19.3
      mgmt-ipv4: 172.31.100.25
      ports:
      - 127.0.0.1:5601:5601
      env:
        OPENSEARCH_HOSTS: '["http://172.31.100.21:9200"]'
        DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    prometheus:
      kind: linux
      image: prom/prometheus:v3.5.0
      mgmt-ipv4: 172.31.100.22
      ports:
      - 127.0.0.1:9090:9090
      cmd: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
      binds:
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../runtime/discovery:/etc/prometheus/discovery:ro
      - ../runtime/prometheus:/prometheus
    grafana:
      kind: linux
      image: clab-observability-grafana:0.1.0
      mgmt-ipv4: 172.31.100.23
      ports:
      - 127.0.0.1:3000:3000
      env:
        GF_SECURITY_ADMIN_USER: ${LAB_USERNAME}
        GF_SECURITY_ADMIN_PASSWORD: ${LAB_PASSWORD}
      binds:
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../runtime/grafana:/var/lib/grafana
    discovery:
      kind: linux
      image: clab-observability-collector:0.1.0
      mgmt-ipv4: 172.31.100.24
      cmd: discovery
      binds:
      - ../runtime/discovery:/discovery
      env:
        AWS_ENDPOINT_URL: http://172.31.100.20:4566
